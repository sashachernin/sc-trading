name: deterministic validation
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lab
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: lab
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://lab:ci-only@localhost:5432/lab
      CODEX_MODE: fake
      MARKET_PROVIDER: synthetic
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r requirements.lock && python -m pip install --no-deps -e .
      - run: alembic upgrade head
      - run: pytest -q
      - run: python -m app.cli demo --weeks 3
      - run: python -m app.cli worker-once
      - run: npm ci && npm run build
        working-directory: frontend
      - run: python scripts/check_static.py
