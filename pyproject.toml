[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investment-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["SQLAlchemy>=2.0,<2.1", "pydantic>=2.12,<3", "pydantic-settings>=2.10,<3", "alembic>=1.16,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1", "exchange-calendars>=4.11,<5", "jsonschema>=4.25,<5", "tiktoken>=0.12,<1"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
